version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: yn-wedding-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yen_nhi_wedding
    ports:
      - "5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yen_nhi_wedding"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: yn-wedding-app
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgres://postgres:postgres@db:5432/yen_nhi_wedding
      ADMIN_PASSWORD: admin
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
